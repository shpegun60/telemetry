name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.cxx }} ${{ matrix.standard }} ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++-18]
        standard: [c++20]
        mode: [release]
        include:
          - {cxx: clang++-18, standard: c++20, mode: sanitized}
          - {cxx: g++, standard: c++20, mode: nullchecks}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Clang LTO linker
        if: matrix.cxx == 'clang++-18'
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Shared ID, slot and numeric contracts
        env:
          CXX: ${{ matrix.cxx }}
          STANDARD: ${{ matrix.standard }}
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/run_checks.py --std "$STANDARD" --build-dir build/checks "${flags[@]}"
      - name: Retain shared contract logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-${{ matrix.cxx }}-${{ matrix.standard }}-${{ matrix.mode }}
          path: |
            build/checks/*.log
            build/checks/summary.json
          if-no-files-found: error
      - name: C++20 resource libraries
        if: matrix.standard == 'c++20' || matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/resources/run.py --build-dir build/resources "${flags[@]}"
      - name: C++20 structured reflection backend
        if: matrix.standard == 'c++20' && matrix.mode == 'release'
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 tests/structured/reflection/run.py --build-dir build/structured-reflection
      - name: C++20 structured facade
        if: matrix.standard == 'c++20' && matrix.mode == 'release'
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 tests/structured/facade/run.py --build-dir build/structured-facade
      - name: C++20 structured wire types
        if: matrix.standard == 'c++20' && matrix.mode == 'release'
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 tests/structured/types/run.py --build-dir build/structured-types
      - name: C++20 structured wire types sanitized
        if: matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 tests/structured/types/run.py --sanitize --build-dir build/structured-types-sanitized
      - name: C++20 structured codec and workspace
        if: matrix.standard == 'c++20' && matrix.mode == 'release'
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 tests/structured/codec/run.py --build-dir build/structured-codec
      - name: C++20 structured codec and workspace sanitized
        if: matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 tests/structured/codec/run.py --sanitize --build-dir build/structured-codec-sanitized
      - name: C++20 structured TypeRegistry
        if: matrix.standard == 'c++20' && matrix.mode == 'release'
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 tests/structured/registry/run.py --build-dir build/structured-registry
      - name: C++20 structured TypeRegistry sanitized
        if: matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 tests/structured/registry/run.py --sanitize --build-dir build/structured-registry-sanitized
      - name: C++20 structured native Service
        if: matrix.standard == 'c++20' || matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/structured/service/run.py --build-dir build/structured-service "${flags[@]}"
      - name: C++20 structured Service Model
        if: matrix.standard == 'c++20' || matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/structured/model/run.py --build-dir build/structured-model "${flags[@]}"
      - name: C++20 structured mixed Field and Command endpoints
        if: matrix.standard == 'c++20' || matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/structured/endpoints/run.py --build-dir build/structured-endpoints "${flags[@]}"
          python3 tests/structured/endpoints/storage.py --build-dir build/structured-storage "${flags[@]}"
      - name: C++20 structured descriptor v3
        if: matrix.standard == 'c++20' || matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/structured/descriptor/run.py --build-dir build/structured-descriptor "${flags[@]}"
      - name: C++20 structured resource providers
        if: matrix.standard == 'c++20' || matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/structured/resources/run.py --build-dir build/structured-resources "${flags[@]}"
      - name: C++20 structured typed traversal and native As access
        if: matrix.standard == 'c++20' || matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/structured/traversal/run.py --build-dir build/structured-traversal "${flags[@]}"
      - name: C++20 optional structured protocol example
        if: matrix.standard == 'c++20' || matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/structured/exchange/run.py --build-dir build/structured-exchange "${flags[@]}"
      - name: C++20 structured JS client interoperability
        if: matrix.standard == 'c++20' || matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/structured/client/run.py --build-dir build/structured-client "${flags[@]}"
      - name: C++20 structured multi-TU qualification
        if: matrix.standard == 'c++20' || matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/structured/qualification/run.py --build-dir build/structured-qualification "${flags[@]}"
      - name: C++20 MCU probe bodies on host
        if: matrix.standard == 'c++20' || matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/structured/mcu/run.py --build-dir build/structured-mcu "${flags[@]}"
      - name: C++20 structured API and wire freeze contract
        if: matrix.standard == 'c++20' || matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/structured/freeze/run.py --build-dir build/structured-freeze "${flags[@]}"
      - name: Retain structured descriptor logs
        if: always() && (matrix.standard == 'c++20' || matrix.mode == 'sanitized')
        uses: actions/upload-artifact@v4
        with:
          name: descriptor-${{ matrix.cxx }}-${{ matrix.standard }}-${{ matrix.mode }}
          path: |
            build/structured-descriptor/*.log
            build/structured-descriptor/*.json
            build/structured-descriptor/*.bin
            build/structured-resources/*.log
            build/structured-resources/*.json
            build/structured-resources/*.bin
            build/structured-exchange/*.log
            build/structured-exchange/*.json
            build/structured-exchange/*.bin
            build/structured-traversal/*.log
            build/structured-traversal/*.json
            build/structured-client/*.log
            build/structured-client/summary.json
            build/structured-qualification/*.log
            build/structured-qualification/summary.json
            build/structured-mcu/*.log
            build/structured-mcu/*.json
            build/structured-mcu/*.su
            build/structured-freeze/*.log
            build/structured-freeze/summary.json
            build/structured-freeze/O2
            build/structured-freeze/Os
            build/structured-freeze/Og
          if-no-files-found: ignore
      - name: Verify retained hardware evidence
        if: matrix.cxx == 'g++' && matrix.standard == 'c++20' && matrix.mode == 'release'
        run: |
          python3 doc/evidence/pre-unification/stage08/verify.py --receipt doc/evidence/pre-unification/stage08/final-receipt.json --self-test
          python3 doc/evidence/pre-unification/stage08/verify.py --receipt doc/evidence/pre-unification/stage08/storage-receipt.json --self-test
          python3 doc/evidence/pre-unification/stage08/verify.py --receipt doc/evidence/pre-unification/stage08/dispatch-receipt.json --self-test
          python3 doc/evidence/pre-unification/stage08/verify.py --receipt doc/evidence/pre-unification/stage08/dispatch-inline-rejected-receipt.json --self-test
          python3 tests/structured/descriptor/h7s/verify.py --self-test
          python3 tests/structured/resources/h7s/verify.py --self-test
          python3 tests/structured/exchange/h7s/verify.py --self-test

  arm:
    name: Cortex-M7 compile and link
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GCC and newlib-nano
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Shared Cortex-M7 ID and slot checks
        run: |
          python3 tests/h7s_support/check.py
          python3 tests/run_arm_checks.py --build-dir build/arm
          python3 tests/run_arm_checks.py --null-checks --build-dir build/arm-null
      - name: C++20 resource Cortex-M7 checks
        run: python3 tests/resources/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-resources
      - name: C++20 structured reflection Cortex-M7 checks
        run: python3 tests/structured/reflection/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-reflection
      - name: C++20 structured facade Cortex-M7 checks
        run: python3 tests/structured/facade/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-facade
      - name: C++20 structured wire types Cortex-M7 checks
        run: python3 tests/structured/types/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-types
      - name: C++20 structured codec Cortex-M7 checks
        run: python3 tests/structured/codec/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-codec
      - name: C++20 structured TypeRegistry Cortex-M7 checks
        run: python3 tests/structured/registry/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-registry
      - name: C++20 structured native Service Cortex-M7 checks
        run: |
          python3 tests/structured/service/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-service
          python3 tests/structured/service/run.py --arm --null-checks --cxx arm-none-eabi-g++ --build-dir build/arm-structured-service-nullchecks
      - name: C++20 structured Service Model Cortex-M7 checks
        run: |
          python3 tests/structured/model/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-model
          python3 tests/structured/model/run.py --arm --null-checks --cxx arm-none-eabi-g++ --build-dir build/arm-structured-model-nullchecks
      - name: C++20 structured mixed endpoints Cortex-M7 checks
        run: |
          python3 tests/structured/endpoints/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-endpoints
          python3 tests/structured/endpoints/run.py --arm --null-checks --cxx arm-none-eabi-g++ --build-dir build/arm-structured-endpoints-nullchecks
          python3 tests/structured/endpoints/storage.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-storage
      - name: C++20 structured descriptor Cortex-M7 checks
        run: |
          python3 tests/structured/descriptor/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-descriptor
          python3 tests/structured/descriptor/run.py --arm --null-checks --cxx arm-none-eabi-g++ --build-dir build/arm-structured-descriptor-nullchecks
      - name: C++20 structured resource Cortex-M7 checks
        run: python3 tests/structured/resources/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-resources
      - name: C++20 structured typed traversal Cortex-M7 checks
        run: |
          python3 tests/structured/traversal/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-traversal
          python3 tests/structured/traversal/run.py --arm --null-checks --cxx arm-none-eabi-g++ --build-dir build/arm-structured-traversal-nullchecks
      - name: C++20 optional structured protocol Cortex-M7 checks
        run: python3 tests/structured/exchange/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-exchange
      - name: C++20 structured multi-TU Cortex-M7 qualification
        run: |
          python3 tests/structured/qualification/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-qualification
          python3 tests/structured/qualification/run.py --arm --null-checks --cxx arm-none-eabi-g++ --build-dir build/arm-structured-qualification-nullchecks
      - name: C++20 MCU probe offline Cortex-M7 codegen
        run: |
          python3 tests/structured/mcu/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-mcu
          python3 tests/structured/mcu/run.py --arm --null-checks --cxx arm-none-eabi-g++ --build-dir build/arm-structured-mcu-nullchecks
      - name: Verify retained offline qualification receipt
        run: python3 tests/structured/mcu/receipt.py verify tests/structured/mcu/local-receipt.json --self-test
      - name: Verify retained H7S qualification evidence
        run: python3 tests/structured/mcu/h7s/verify.py --self-test
      - name: C++20 structured API and wire freeze Cortex-M7 contract
        run: |
          python3 tests/structured/freeze/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-structured-freeze
          python3 tests/structured/freeze/run.py --arm --null-checks --cxx arm-none-eabi-g++ --build-dir build/arm-structured-freeze-nullchecks
      - name: Retain compiler and object inspection logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-m7-check-logs
          path: |
            build/arm/*.log
            build/arm/*.json
            build/arm/*.su
            build/arm-null/*.log
            build/arm-null/*.json
            build/arm-null/*.su
            build/arm-resources/*.log
            build/arm-resources/*.su
            build/arm-structured-reflection/*.log
            build/arm-structured-facade/*.log
            build/arm-structured-types/*.log
            build/arm-structured-codec/*.log
            build/arm-structured-codec/*.su
            build/arm-structured-registry/*.log
            build/arm-structured-service/*.log
            build/arm-structured-service/*.su
            build/arm-structured-service-nullchecks/*.log
            build/arm-structured-service-nullchecks/*.su
            build/arm-structured-model/*.log
            build/arm-structured-model/*.su
            build/arm-structured-model-nullchecks/*.log
            build/arm-structured-model-nullchecks/*.su
            build/arm-structured-endpoints/*.log
            build/arm-structured-endpoints/*.su
            build/arm-structured-endpoints/*.json
            build/arm-structured-endpoints-nullchecks/*.log
            build/arm-structured-endpoints-nullchecks/*.su
            build/arm-structured-storage/*.log
            build/arm-structured-storage/*.su
            build/arm-structured-storage/*.json
            build/arm-structured-descriptor/*.log
            build/arm-structured-descriptor/*.su
            build/arm-structured-descriptor/*.json
            build/arm-structured-descriptor/*.bin
            build/arm-structured-descriptor-nullchecks/*.log
            build/arm-structured-descriptor-nullchecks/*.su
            build/arm-structured-descriptor-nullchecks/*.json
            build/arm-structured-descriptor-nullchecks/*.bin
            build/arm-structured-resources/*.log
            build/arm-structured-resources/*.json
            build/arm-structured-resources/*.su
            build/arm-structured-exchange/*.log
            build/arm-structured-exchange/*.json
            build/arm-structured-exchange/*.su
            build/arm-structured-traversal/*.log
            build/arm-structured-traversal/*.json
            build/arm-structured-qualification/*.log
            build/arm-structured-qualification/*.json
            build/arm-structured-qualification/*.su
            build/arm-structured-qualification/symbol-control.elf
            build/arm-structured-qualification-nullchecks/*.log
            build/arm-structured-qualification-nullchecks/*.json
            build/arm-structured-qualification-nullchecks/*.su
            build/arm-structured-qualification-nullchecks/symbol-control.elf
            build/arm-structured-mcu/*.log
            build/arm-structured-mcu/*.json
            build/arm-structured-mcu/*.su
            build/arm-structured-mcu/symbol-control.elf
            build/arm-structured-mcu-nullchecks/*.log
            build/arm-structured-mcu-nullchecks/*.json
            build/arm-structured-mcu-nullchecks/*.su
            build/arm-structured-mcu-nullchecks/symbol-control.elf
            build/arm-structured-freeze/*.log
            build/arm-structured-freeze/summary.json
            build/arm-structured-freeze/*.su
            build/arm-structured-freeze/*.elf
            build/arm-structured-freeze-nullchecks/*.log
            build/arm-structured-freeze-nullchecks/summary.json
            build/arm-structured-freeze-nullchecks/*.su
            build/arm-structured-freeze-nullchecks/*.elf
            build/arm-structured-traversal/*.su
          if-no-files-found: ignore

  qt:
    name: Qt playground
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev
      - name: Build
        run: |
          mkdir -p build/qt
          cd build/qt
          qmake6 ../../telemetry.pro CONFIG+=release QMAKE_CXXFLAGS+=-Werror
          make -j2
      - name: Startup check
        run: build/qt/telemetry_playground -platform offscreen --smoke-test
      - name: Independent resource qmake configurations
        run: python3 tests/structured/resources/run_qmake.py --qmake qmake6 --build-dir build/resource-qmake
      - name: Explicit structured protocol example qmake
        run: |
          mkdir -p build/example-qmake
          cd build/example-qmake
          qmake6 ../../tests/structured/exchange/qmake.pro CONFIG+=release QMAKE_CXXFLAGS+=-Werror QMAKE_CXXFLAGS+=-UNDEBUG
          make -j2
          ./structured_protocol_example
      - name: Structured client Qt C++20 smoke
        run: |
          mkdir -p build/client-qt
          cd build/client-qt
          qmake6 ../../examples/structured_client/qt.pro CONFIG+=release QMAKE_CXXFLAGS+=-Werror
          make -j2
          ./structured_client_qt
      - name: Structured-only multi-TU qmake consumer
        run: |
          mkdir -p build/qualification-qt
          cd build/qualification-qt
          qmake6 ../../tests/structured/qualification/qmake.pro CONFIG+=release QMAKE_CXXFLAGS+=-Werror
          make -j2
          ./structured_qualification
          if grep -E 'TelemetryJson.cpp|resource/telemetry/(Schema|Commands|Values)File.cpp|structured_protocol/(Bind|Exchange).cpp' Makefile; then exit 1; fi
      - name: Structured client browser and fake Device
        run: |
          python3 -m venv build/client-venv
          build/client-venv/bin/pip install playwright==1.63.0
          build/client-venv/bin/python -m playwright install --with-deps chromium
          build/client-venv/bin/python tests/structured/client/run.py --browser --build-dir build/client-browser
      - name: Retain client browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-client-browser
          path: |
            build/client-browser/*.log
            build/client-browser/summary.json
            build/client-browser/*.png
          if-no-files-found: ignore
