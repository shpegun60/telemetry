name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.cxx }} ${{ matrix.standard }} ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++-18]
        standard: [c++17, c++20]
        mode: [release]
        include:
          - {cxx: clang++-18, standard: c++17, mode: sanitized}
          - {cxx: g++, standard: c++17, mode: nullchecks}
          - {cxx: g++, standard: c++20, mode: nullchecks}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare decimal-comma locale
        run: sudo localedef -i de_DE -f UTF-8 de_DE.UTF-8
      - name: Install Clang LTO linker
        if: matrix.cxx == 'clang++-18'
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Compile and check
        env:
          CXX: ${{ matrix.cxx }}
          STANDARD: ${{ matrix.standard }}
          MODE: ${{ matrix.mode }}
          TELEMETRY_TEST_LOCALE: de_DE.UTF-8
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/run_checks.py --std "$STANDARD" --build-dir build/checks "${flags[@]}"
      - name: C++20 resource libraries
        if: matrix.standard == 'c++20' || matrix.mode == 'sanitized'
        env:
          CXX: ${{ matrix.cxx }}
          MODE: ${{ matrix.mode }}
          TELEMETRY_TEST_LOCALE: de_DE.UTF-8
        run: |
          flags=()
          if [ "$MODE" = sanitized ]; then flags+=(--sanitize); fi
          if [ "$MODE" = nullchecks ]; then flags+=(--null-checks); fi
          python3 tests/resources/run.py --node node --build-dir build/resources "${flags[@]}"
      - name: Verify retained hardware evidence
        if: matrix.cxx == 'g++' && matrix.standard == 'c++17'
        run: |
          python3 tests/field_layout/h7s/verify.py --self-test
          python3 tests/field_layout/h7s/verify.py --receipt tests/field_layout/h7s/final-receipt.json --samples tests/field_layout/h7s/final-samples.csv --self-test
          python3 tests/field_layout/h7s/verify.py --receipt tests/field_layout/h7s/rw32-receipt.json --samples tests/field_layout/h7s/rw32-samples.csv --self-test
          python3 tests/field_layout/h7s/verify.py --receipt tests/field_layout/h7s/compact-callback-receipt.json --samples tests/field_layout/h7s/compact-callback-samples.csv --self-test
          python3 tests/json_stack/verify.py --self-test
          python3 tests/json_stack/verify.py --receipt tests/json_stack/rw32-receipt.json --self-test
          python3 tests/json_stack/verify.py --receipt tests/json_stack/abi-guard-receipt.json --self-test
          python3 tests/json_stack/verify.py --receipt tests/json_stack/layered-receipt.json --self-test
          python3 tests/command_dispatch/h7s/verify.py --self-test
          python3 tests/position_tables/h7s/verify.py --self-test
          python3 tests/resources/h7s/verify.py --self-test
          python3 tests/regression/h7s/verify.py --self-test
          python3 tests/regression/h7s/verify.py --receipt tests/regression/h7s/followup-receipt.json --self-test

  arm:
    name: Cortex-M7 compile and link
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GCC and newlib-nano
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Compile, inspect constant storage and link
        run: python3 tests/run_arm_checks.py --build-dir build/arm
      - name: C++20 resource Cortex-M7 checks
        run: python3 tests/resources/run.py --arm --cxx arm-none-eabi-g++ --build-dir build/arm-resources
      - name: Retain compiler and object inspection logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-m7-check-logs
          path: |
            build/arm/*.log
            build/arm-resources/*.log
            build/arm-resources/*.su
          if-no-files-found: ignore

  qt:
    name: Qt playground
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev
      - name: Build
        run: |
          mkdir -p build/qt
          cd build/qt
          qmake6 ../../telemetry.pro CONFIG+=release QMAKE_CXXFLAGS+=-Werror
          make -j2
      - name: Startup check
        run: build/qt/telemetry_playground -platform offscreen --smoke-test
      - name: Resource adapter without telemetry JSON
        run: |
          mkdir -p build/no-json
          cd build/no-json
          qmake6 ../../tests/resources/no_json.pro CONFIG+=release QMAKE_CXXFLAGS+=-Werror
          make -j2
          ./resource_no_json
